# ============================================================
# SHIELD FRAMEWORK — LAYER 4: DEPLOYMENT GATE
# GitHub Actions CI/CD Pipeline
#
# Blocks deployment on any High-severity Bandit finding.
# Warns on Medium. Passes on Low/Clean.
#
# File location in your repo: .github/workflows/shield_gate.yml
# ============================================================

name: SHIELD Security Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1: BANDIT — Python / Flask SAST
  # ──────────────────────────────────────────────────────────
  bandit-scan:
    name: Bandit SAST (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit (JSON output)
        id: bandit
        run: |
          bandit -r . \
            --exclude ./tests,./node_modules,./.github,./venv,./.venv,./snippets \
            -f json \
            -o bandit_report.json \
            -q || true

      - name: Parse Bandit results and enforce gate
        run: |
          python3 << 'EOF'
          import json, sys

          try:
              with open('bandit_report.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::warning::Could not parse Bandit report: {e}")
              sys.exit(0)

          results = data.get('results', [])
          high    = [r for r in results if r.get('issue_severity') == 'HIGH']
          medium  = [r for r in results if r.get('issue_severity') == 'MEDIUM']
          low     = [r for r in results if r.get('issue_severity') == 'LOW']

          print(f"::notice::SHIELD Layer 4 — Bandit Results")
          print(f"::notice::High: {len(high)}  Medium: {len(medium)}  Low: {len(low)}")

          # Print High findings as errors (blocks merge)
          for issue in high:
              filename = issue.get('filename', 'unknown')
              line     = issue.get('line_number', '?')
              test_id  = issue.get('test_id', '')
              text     = issue.get('issue_text', '')
              cwe      = issue.get('issue_cwe', {}).get('id', '?')
              print(f"::error file={filename},line={line}::[{test_id}] {text} (CWE-{cwe})")

          # Print Medium findings as warnings (does not block)
          for issue in medium:
              filename = issue.get('filename', 'unknown')
              line     = issue.get('line_number', '?')
              test_id  = issue.get('test_id', '')
              text     = issue.get('issue_text', '')
              print(f"::warning file={filename},line={line}::[{test_id}] {text}")

          # GATE DECISION
          if high:
              print(f"\n::error::SHIELD Layer 4 — DEPLOYMENT BLOCKED")
              print(f"::error::{len(high)} High-severity finding(s) must be resolved before deployment.")
              print(f"::error::Run FDSP Layer 3 remediation: python fdsp_layer3.py --corpora . --k 3")
              sys.exit(1)
          elif medium:
              print(f"\n::warning::SHIELD Layer 4 — DEPLOYMENT WARNED")
              print(f"::warning::{len(medium)} Medium-severity finding(s). Security review recommended within 5 days.")
              sys.exit(0)
          else:
              print(f"\n::notice::SHIELD Layer 4 — CLEAN ✅  Deployment approved.")
              sys.exit(0)
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 2: SEMGREP — Node.js / Express SAST
  # ──────────────────────────────────────────────────────────
  semgrep-scan:
    name: Semgrep SAST (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for pysemgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (JSON output)
        id: semgrep
        run: |
          semgrep \
            --config=p/nodejs \
            --json \
            --output semgrep_report.json \
            --exclude=node_modules,dist,.github \
            . || true

      - name: Parse Semgrep results and enforce gate
        run: |
          python3 << 'EOF'
          import json, sys

          try:
              with open('semgrep_report.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::warning::Could not parse Semgrep report: {e}")
              sys.exit(0)

          findings = data.get('results', [])
          errors   = data.get('errors', [])

          blocking = []
          warnings = []

          for f in findings:
              sev = f.get('extra', {}).get('severity', '').upper()
              if sev in ('ERROR', 'BLOCKING'):
                  blocking.append(f)
              else:
                  warnings.append(f)

          print(f"::notice::SHIELD Layer 4 — Semgrep Results")
          print(f"::notice::Blocking: {len(blocking)}  Warnings: {len(warnings)}")

          for finding in blocking:
              path  = finding.get('path', 'unknown')
              start = finding.get('start', {}).get('line', '?')
              rule  = finding.get('check_id', 'unknown-rule')
              msg   = finding.get('extra', {}).get('message', '')[:120]
              print(f"::error file={path},line={start}::[SEMGREP] {rule}: {msg}")

          for finding in warnings:
              path  = finding.get('path', 'unknown')
              start = finding.get('start', {}).get('line', '?')
              rule  = finding.get('check_id', 'unknown-rule')
              print(f"::warning file={path},line={start}::[SEMGREP] {rule}")

          # GATE DECISION
          if blocking:
              print(f"\n::error::SHIELD Layer 4 — DEPLOYMENT BLOCKED")
              print(f"::error::{len(blocking)} Blocking Semgrep finding(s) must be resolved.")
              sys.exit(1)
          else:
              print(f"\n::notice::SHIELD Layer 4 — CLEAN ✅  Deployment approved.")
              sys.exit(0)
          EOF

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 3: GATE SUMMARY
  # Runs after both scans — only passes if both jobs pass
  # ──────────────────────────────────────────────────────────
  shield-gate-summary:
    name: SHIELD Gate Final Decision
    runs-on: ubuntu-latest
    needs: [ bandit-scan, semgrep-scan ]
    if: always()

    steps:
      - name: Evaluate gate result
        run: |
          BANDIT_STATUS="${{ needs.bandit-scan.result }}"
          SEMGREP_STATUS="${{ needs.semgrep-scan.result }}"

          echo "Bandit:  $BANDIT_STATUS"
          echo "Semgrep: $SEMGREP_STATUS"

          if [ "$BANDIT_STATUS" = "failure" ] || [ "$SEMGREP_STATUS" = "failure" ]; then
            echo "::error::SHIELD Layer 4 — DEPLOYMENT BLOCKED by security gate."
            echo "::error::Resolve all High/Blocking findings before merging."
            exit 1
          else
            echo "::notice::SHIELD Layer 4 — ALL SCANS PASSED ✅  Safe to deploy."
          fi
