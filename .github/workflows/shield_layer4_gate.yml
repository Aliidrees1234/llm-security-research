# ============================================================
# SHIELD FRAMEWORK — LAYER 4: DEPLOYMENT GATE
# GitHub Actions CI/CD Pipeline
#
# Runs on every push and pull request to main.
# Blocks deployment on any High-severity Bandit finding.
# Runs pytest to ensure all 41 tests pass.
#
# Author: Ali Yasin Idrees
# Version: 0.9.0
# ============================================================

name: SHIELD Security Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ────────────────────────────────────────────────────────
  # JOB 1: PYTEST — All 41 rules tests must pass
  # ────────────────────────────────────────────────────────
  pytest:
    name: pytest — Rule Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SHIELD and dependencies
        run: |
          pip install -e .
          pip install pytest bandit bcrypt colorama astor

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────
  # JOB 2: BANDIT — Python SAST on shield/ folder only
  # ────────────────────────────────────────────────────────
  bandit-scan:
    name: Bandit SAST — shield/
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit on shield/ only
        run: |
          bandit -r shield/ \
            -f json \
            -o bandit_report.json \
            -q || true

      - name: Parse results and enforce gate
        run: |
          python3 << 'EOF'
          import json, sys

          try:
              with open('bandit_report.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::warning::Could not parse Bandit report: {e}")
              sys.exit(0)

          results = data.get('results', [])
          high   = [r for r in results if r.get('issue_severity') == 'HIGH']
          medium = [r for r in results if r.get('issue_severity') == 'MEDIUM']
          low    = [r for r in results if r.get('issue_severity') == 'LOW']

          print(f"::notice::SHIELD Layer 4 — Bandit Results")
          print(f"::notice::High: {len(high)}  Medium: {len(medium)}  Low: {len(low)}")

          # Print High findings as errors — blocks merge
          for issue in high:
              filename = issue.get('filename', 'unknown')
              line     = issue.get('line_number', '?')
              test_id  = issue.get('test_id', '')
              text     = issue.get('issue_text', '')
              cwe      = issue.get('issue_cwe', {}).get('id', '?')
              print(f"::error file={filename},line={line}::[{test_id}] {text} (CWE-{cwe})")

          # Print Medium as warnings — does not block
          for issue in medium:
              filename = issue.get('filename', 'unknown')
              line     = issue.get('line_number', '?')
              test_id  = issue.get('test_id', '')
              text     = issue.get('issue_text', '')
              print(f"::warning file={filename},line={line}::[{test_id}] {text}")

          # Gate decision
          if high:
              print(f"\n::error::SHIELD Layer 4 — DEPLOYMENT BLOCKED")
              print(f"::error::{len(high)} High-severity finding(s) must be resolved.")
              sys.exit(1)
          elif medium:
              print(f"\n::warning::SHIELD Layer 4 — WARNING: {len(medium)} Medium finding(s)")
              sys.exit(0)
          else:
              print(f"\n::notice::SHIELD Layer 4 — CLEAN ✅")
              sys.exit(0)
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.json
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # JOB 3: SEMGREP — Node.js scan on shield/ folder
  # ────────────────────────────────────────────────────────
  semgrep-scan:
    name: Semgrep SAST — shield/
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep on shield/ only
        run: |
          semgrep \
            --config=p/nodejs \
            --json \
            --output semgrep_report.json \
            shield/ || true

      - name: Parse results and enforce gate
        run: |
          python3 << 'EOF'
          import json, sys

          try:
              with open('semgrep_report.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::warning::Could not parse Semgrep report: {e}")
              sys.exit(0)

          findings = data.get('results', [])
          blocking = [
              f for f in findings
              if f.get('extra', {}).get('severity', '').upper()
              in ('ERROR', 'BLOCKING', 'WARNING')
          ]

          print(f"::notice::SHIELD Layer 4 — Semgrep Results")
          print(f"::notice::Findings: {len(blocking)}")

          for finding in blocking:
              path  = finding.get('path', 'unknown')
              start = finding.get('start', {}).get('line', '?')
              rule  = finding.get('check_id', 'unknown')
              msg   = finding.get('extra', {}).get('message', '')[:120]
              print(f"::warning file={path},line={start}::[SEMGREP] {rule}: {msg}")

          if not findings:
              print(f"\n::notice::SHIELD Layer 4 — Semgrep CLEAN ✅")

          sys.exit(0)

          EOF

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_report.json
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # JOB 4: FINAL GATE — all jobs must pass
  # ────────────────────────────────────────────────────────
  shield-gate:
    name: SHIELD Gate — Final Decision
    runs-on: ubuntu-latest
    needs: [ pytest, bandit-scan, semgrep-scan ]
    if: always()

    steps:
      - name: Evaluate all jobs
        run: |
          PYTEST="${{ needs.pytest.result }}"
          BANDIT="${{ needs.bandit-scan.result }}"
          SEMGREP="${{ needs.semgrep-scan.result }}"

          echo "pytest:  $PYTEST"
          echo "Bandit:  $BANDIT"
          echo "Semgrep: $SEMGREP"

          if [ "$PYTEST" = "failure" ]; then
            echo "::error::SHIELD Gate — BLOCKED: Tests failed"
            echo "::error::All 41 rule tests must pass before deployment"
            exit 1
          fi

          if [ "$BANDIT" = "failure" ]; then
            echo "::error::SHIELD Gate — BLOCKED: High-severity findings in shield/"
            exit 1
          fi

          echo "::notice::SHIELD Gate — ALL CHECKS PASSED ✅"
          echo "::notice::pytest ✅  Bandit ✅  Semgrep ✅"